<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#15181f"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#aeb4bf"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2fb457"/>
      <stop offset="0.62" stop-color="#46d06a"/>
      <stop offset="0.80" stop-color="#e3c63a"/>
      <stop offset="1" stop-color="#e8503f"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded square with margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- three channels: meter + fader -->
  <g>
    <!-- channel 1 -->
    <rect x="218" y="230" width="44" height="564" rx="10" fill="#0b0d11"/>
    <rect x="218" y="430" width="44" height="364" rx="10" fill="url(#meter)"/>
    <rect x="312" y="230" width="16" height="564" rx="8" fill="#0b0d11"/>
    <rect x="270" y="400" width="100" height="64" rx="16" fill="url(#knob)"/>
    <rect x="270" y="428" width="100" height="8" fill="#20242c"/>

    <!-- channel 2 -->
    <rect x="438" y="230" width="44" height="564" rx="10" fill="#0b0d11"/>
    <rect x="438" y="290" width="44" height="504" rx="10" fill="url(#meter)"/>
    <rect x="532" y="230" width="16" height="564" rx="8" fill="#0b0d11"/>
    <rect x="490" y="290" width="100" height="64" rx="16" fill="url(#knob)"/>
    <rect x="490" y="318" width="100" height="8" fill="#20242c"/>

    <!-- channel 3 -->
    <rect x="658" y="230" width="44" height="564" rx="10" fill="#0b0d11"/>
    <rect x="658" y="560" width="44" height="234" rx="10" fill="url(#meter)"/>
    <rect x="752" y="230" width="16" height="564" rx="8" fill="#0b0d11"/>
    <rect x="710" y="540" width="100" height="64" rx="16" fill="url(#knob)"/>
    <rect x="710" y="568" width="100" height="8" fill="#20242c"/>
  </g>
</svg>
